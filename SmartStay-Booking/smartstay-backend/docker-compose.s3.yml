# Optional local S3 stack. Enable with: python scripts/configure_local_s3.py
services:
  s3:
    image: rustfs/rustfs:1.0.3-glibc
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Run python scripts/configure_local_s3.py first}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Run python scripts/configure_local_s3.py first}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "warn"
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3_data:/data
      - s3_logs:/var/log/rustfs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--max-time", "3", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  s3-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MEDIA_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:9000
    entrypoint: ["python", "-m", "app.core.s3_setup"]
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy

  backend:
    environment:
      MEDIA_BACKEND: s3
      S3_ENDPOINT_URL: http://s3:9000
    depends_on:
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      timeout: 30s
      start_period: 30s

volumes:
  s3_data:
  s3_logs:
